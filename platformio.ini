; MiniAzan — dual-target PlatformIO configuration
; Default: ESP32-S3 N16R8 (16 MB flash, 8 MB OPI PSRAM)
; Legacy:  env:esp32dev (ESP32 WROOM, 4 MB flash, no PSRAM)

[platformio]
default_envs = esp32s3-n16r8

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
upload_protocol = esptool
upload_speed = 921600
lib_deps =
    ESP32-audioI2S
    adafruit/RTClib @ ^2.1.1
    lvgl/lvgl @ ^8.3.11
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    -DMINI_AZAN_TOUCH_VALIDATION_MODE=0
    -DMINI_AZAN_UI_ENABLE=1
    -DMINI_AZAN_TOUCH_DEBUG=0
    -DMINI_AZAN_LVGL_TOUCH_LOG=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h
    -DLV_USE_SPINBOX=0
    -DLV_USE_TEXTAREA=0
    -DLV_USE_KEYBOARD=0
    -DLV_USE_MSGBOX=0

; ── ESP32 WROOM (legacy, 4 MB flash, no PSRAM) ───────────────────────────────
[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
board_build.partitions = partitions/miniazan_app.csv

; ── ESP32-S3 N16R8 (16 MB flash, 8 MB OPI PSRAM) ────────────────────────────
[env:esp32s3-n16r8]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
board_build.partitions = partitions/miniazan_s3_16mb.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DMINI_AZAN_TARGET_S3=1
    -DBOARD_HAS_PSRAM

; Touch lab: cd examples/xpt2046_touch_test && pio run -e esp32s3-n16r8 -t upload -t monitor
