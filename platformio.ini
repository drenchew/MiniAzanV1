[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Default partition is ~1.31MB app → shows ~92% with current firmware.
; miniazan_app gives ~3.94MB factory app on 4MB flash (headroom for LVGL).
board_build.partitions = partitions/miniazan_app.csv

build_flags =
    ; LVGL UI enabled. Touch lab: VALIDATION=1 UI_ENABLE=0
    -DMINI_AZAN_TOUCH_VALIDATION_MODE=0
    -DMINI_AZAN_UI_ENABLE=1
    -DMINI_AZAN_TOUCH_DEBUG=0
    -DMINI_AZAN_LVGL_TOUCH_LOG=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h
    -DLV_USE_SPINBOX=0
    -DLV_USE_TEXTAREA=0
    -DLV_USE_KEYBOARD=0
    -DLV_USE_MSGBOX=0

monitor_filters = send_on_enter
monitor_echo = yes

lib_deps =
    ESP32-audioI2S
    adafruit/RTClib @ ^2.1.1
    lvgl/lvgl @ ^8.3.11
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/pschatzmann/ESP32-A2DP.git

upload_protocol = esptool
upload_speed = 921600

; Touch lab: cd examples/xpt2046_touch_test && pio run -t upload -t monitor