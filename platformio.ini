[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

monitor_filters = send_on_enter
monitor_echo = yes

lib_deps =
    esphome/ESPAsyncWebServer-esphome @ ^3.2.2
    esphome/AsyncTCP-esphome @ ^2.1.3
    ESP32-audioI2S
    adafruit/RTClib @ ^2.1.1

upload_protocol = esptool
upload_speed = 921600